<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ห้องรอออนไลน์ - Financial Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between">

  <!-- แถบด้านบน -->
  <header class="w-full bg-neutral-950 border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-sky-400 animate-pulse"></div>
      <h1 class="text-lg md:text-xl font-bold tracking-wide">
        FINANCIAL <span class="text-red-500">SIMULATOR</span> <span class="text-neutral-400 font-normal">| ห้องรอเล่นออนไลน์</span>
      </h1>
    </div>
    
    <div class="flex items-center gap-4 text-sm">
      <div class="text-right">
        <div id="uName" class="font-semibold text-white">...</div>
        <div id="uRole" class="text-xs text-neutral-400">...</div>
      </div>
      <button onclick="leaveRoom()" class="text-xs border border-neutral-700 hover:border-red-500 px-3 py-1.5 rounded-lg text-neutral-400 hover:text-white">
        ออกจากห้อง
      </button>
    </div>
  </header>

  <!-- เนื้อหาห้องรอ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- รายชื่อผู้เล่น -->
    <section class="lg:col-span-2 bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg">
      <div>
        <div class="flex justify-between items-center pb-4 border-b border-neutral-800 mb-4">
          <div>
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <span>ผู้เล่นในห้องออนไลน์</span>
              <span id="playerCounter" class="bg-neutral-800 text-sky-400 text-xs px-2.5 py-0.5 rounded-full font-mono">0 / 20</span>
            </h2>
            <p class="text-xs text-neutral-400 mt-0.5">จำกัดผู้เล่นไม่เกิน 20 คนต่อเซสชัน</p>
          </div>
          <div class="flex items-center gap-3 text-xs text-neutral-400">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span> พร้อม</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></span> ยังไม่พร้อม</span>
          </div>
        </div>

        <div id="playerList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[460px] overflow-y-auto pr-1">
          <!-- ผู้เล่นจะแสดงที่นี่แบบ Realtime จากทุกเครื่อง -->
        </div>
      </div>

      <!-- แถบด้านล่าง: ปุ่มพร้อม / ปุ่มเริ่มเกมของ Admin -->
      <div class="pt-6 border-t border-neutral-800 mt-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- ผู้เล่น: สลับสถานะพร้อม -->
        <button id="readyBtn" onclick="toggleReady()" 
                class="w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-400 text-black">
          <span id="readyDot" class="w-2.5 h-2.5 rounded-full bg-black"></span>
          <span id="readyText">กดปุ่ม: พร้อมเล่น</span>
        </button>

        <!-- Admin เท่านั้น: ปุ่มเริ่มเกม -->
        <div id="adminControls" class="w-full sm:w-auto hidden flex items-center gap-3">
          <span class="text-xs text-red-400 font-semibold">[ แผงควบคุม Admin 🥸 ]</span>
          <button onclick="adminStartGame()" 
                  class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-red-600/30 flex items-center justify-center gap-2">
            <span>เริ่มเกมทุกคน</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path></svg>
          </button>
        </div>

      </div>
    </section>

    <!-- ช่องแชทกลางห้อง -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg h-[550px] lg:h-auto">
      <div>
        <h2 class="text-base font-bold text-white pb-3 border-b border-neutral-800">
          ห้องแชทสด (Realtime Chat)
        </h2>
        <div id="chatBox" class="mt-4 space-y-3 overflow-y-auto max-h-[380px] pr-2 text-sm">
          <!-- ข้อความจะไหลลงมาตรงนี้ -->
        </div>
      </div>

      <form onsubmit="sendMessage(event)" class="mt-4 pt-3 border-t border-neutral-800 flex gap-2">
        <input type="text" id="chatMsg" placeholder="พิมพ์ข้อความคุยในห้อง..." 
               class="flex-1 bg-neutral-950 border border-neutral-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
        <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-black px-4 py-2.5 rounded-xl font-semibold text-sm transition-colors">
          ส่ง
        </button>
      </form>
    </section>

  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const currentUser = JSON.parse(localStorage.getItem('gameUser'));
    if (!currentUser) {
      window.location.href = "login.html";
    }

    document.getElementById('uName').innerText = currentUser.name;
    document.getElementById('uRole').innerText = currentUser.role.toUpperCase() + (currentUser.role === 'admin' ? ' 🥸' : '');

    if (currentUser.role === 'admin') {
      document.getElementById('adminControls').classList.remove('hidden');
    }

    let isMyReady = false;
    const roomDoc = db.collection('rooms').doc('main_room');

    // 1. ลงทะเบียนผู้เล่นเข้าสู่ฐานข้อมูล Firestore ทันทีที่เข้าหน้านี้
    async function joinRoom() {
      // ตรวจสอบห้องและผู้เล่น
      const snap = await roomDoc.collection('players').get();
      if (snap.size >= 20 && !snap.docs.some(d => d.id === currentUser.uid)) {
        alert("ห้องนี้มีผู้เล่นเต็ม 20 คนแล้ว!");
        leaveRoom();
        return;
      }

      await roomDoc.collection('players').doc(currentUser.uid).set({
        uid: currentUser.uid,
        name: currentUser.name,
        career: currentUser.career,
        role: currentUser.role,
        isReady: false,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    joinRoom();

    // 2. ฟังความเปลี่ยนแปลงของห้อง (Realtime Listener)
    // 2.1 ตรวจสอบว่าแอดมินสั่งเริ่มเกมหรือยัง (ทุกคนจะเด้งไป game.html ทันที)
    roomDoc.onSnapshot(doc => {
      if (doc.exists && doc.data().status === 'playing') {
        window.location.href = "game.html";
      }
    });

    // 2.2 อัปเดตรายชื่อและไฟสถานะของทุกคนบนหน้าจอ
    roomDoc.collection('players').onSnapshot(snapshot => {
      const container = document.getElementById('playerList');
      const counter = document.getElementById('playerCounter');
      container.innerHTML = '';
      
      const players = [];
      snapshot.forEach(doc => players.push(doc.data()));
      counter.innerText = `${players.length} / 20`;

      players.forEach(p => {
        const isSelf = p.uid === currentUser.uid;
        if (isSelf) isMyReady = p.isReady;

        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border flex items-center justify-between ${
          isSelf ? 'border-sky-500/50 bg-neutral-950' : 'border-neutral-800 bg-neutral-950/60'
        }`;

        // 🟢 เขียว = พร้อม, 🟡 เหลือง = ยังไม่พร้อม
        const statusColor = p.isReady ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-amber-400 shadow-[0_0_8px_#f59e0b]';
        const statusText = p.isReady ? 'พร้อมแล้ว' : 'กำลังเตรียมตัว';

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full ${statusColor}"></span>
            <div>
              <div class="font-semibold text-sm text-white flex items-center gap-1.5">
                ${p.name} ${isSelf ? '<span class="text-[10px] text-sky-400 border border-sky-400/40 rounded px-1">คุณ</span>' : ''}
              </div>
              <div class="text-xs text-neutral-400">${p.career}</div>
            </div>
          </div>
          <span class="text-xs font-medium ${p.isReady ? 'text-emerald-400' : 'text-amber-400'}">${statusText}</span>
        `;
        container.appendChild(card);
      });

      // อัปเดตปุ่มของตัวเอง
      updateMyReadyButton();
    });

    // 3. กดสลับสถานะ "พร้อม"
    async function toggleReady() {
      await roomDoc.collection('players').doc(currentUser.uid).update({
        isReady: !isMyReady
      });
    }

    function updateMyReadyButton() {
      const btn = document.getElementById('readyBtn');
      const txt = document.getElementById('readyText');
      if (isMyReady) {
        btn.className = "w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all shadow-lg flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-black";
        txt.innerText = "สถานะ: พร้อมแล้ว (กดยกเลิก)";
      } else {
        btn.className = "w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all shadow-lg flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-400 text-black";
        txt.innerText = "กดปุ่ม: พร้อมเล่น";
      }
    }

    // 4. ระบบแชทสด
    roomDoc.collection('chat').orderBy('time', 'asc').limitToLast(50).onSnapshot(snapshot => {
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      snapshot.forEach(doc => {
        const msg = doc.data();
        const d = document.createElement('div');
        d.className = "bg-neutral-950 border border-neutral-800 rounded-lg p-2.5";
        d.innerHTML = `
          <div class="flex justify-between items-center text-xs mb-1">
            <span class="font-bold ${msg.role === 'admin' ? 'text-red-400' : 'text-sky-400'}">${msg.sender}</span>
          </div>
          <p class="text-neutral-200 text-sm break-words">${msg.text}</p>
        `;
        box.appendChild(d);
      });
      box.scrollTop = box.scrollHeight;
    });

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatMsg');
      const text = input.value.trim();
      if (!text) return;

      await roomDoc.collection('chat').add({
        sender: currentUser.name,
        role: currentUser.role,
        text: text,
        time: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = '';
    }

    // 5. Admin สั่งเริ่มเกม
    async function adminStartGame() {
      if (confirm("ต้องการเริ่มเกมทันทีหรือไม่? ผู้เล่นทุกคนในห้องจะถูกพาเข้าหน้าเกมพร้อมกัน")) {
        await roomDoc.set({ status: 'playing' }, { merge: true });
      }
    }

    async function leaveRoom() {
      try {
        await roomDoc.collection('players').doc(currentUser.uid).delete();
      } catch (e) {}
      localStorage.removeItem('gameUser');
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
