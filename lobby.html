<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ห้องรอออนไลน์ - Financial Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between">

  <!-- แถบ Header -->
  <header class="w-full bg-neutral-950 border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-sky-400 animate-pulse"></div>
      <div>
        <h1 class="text-base md:text-lg font-bold tracking-wide">
          FINANCIAL <span class="text-red-500">SIMULATOR</span>
        </h1>
        <div class="text-xs text-neutral-400 flex items-center gap-2">
          <span>ห้อง Lobby:</span>
          <span id="displayRoomId" class="text-sky-400 font-mono font-bold text-sm tracking-widest bg-neutral-900 px-2 py-0.5 rounded border border-neutral-800">----</span>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-4 text-sm">
      <div class="text-right">
        <div id="uName" class="font-semibold text-white">...</div>
        <div id="uRole" class="text-xs text-neutral-400">...</div>
      </div>
      <button onclick="leaveRoom()" class="text-xs border border-neutral-700 hover:border-red-500 px-3 py-1.5 rounded-lg text-neutral-400 hover:text-white transition-colors">
        ออกจากห้อง
      </button>
    </div>
  </header>

  <!-- เนื้อหาห้องรอ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- รายชื่อผู้เล่น -->
    <section class="lg:col-span-2 bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg">
      <div>
        <div class="flex justify-between items-center pb-4 border-b border-neutral-800 mb-4">
          <div>
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <span>รายชื่อในห้องออนไลน์</span>
              <span id="playerCounter" class="bg-neutral-800 text-sky-400 text-xs px-2.5 py-0.5 rounded-full font-mono">0 / 20</span>
            </h2>
            <p class="text-xs text-neutral-400 mt-0.5">จำกัดผู้เล่นไม่เกิน 20 คนต่อห้อง</p>
          </div>
          <div class="flex items-center gap-3 text-xs text-neutral-400">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span> พร้อม</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></span> ยังไม่พร้อม</span>
          </div>
        </div>

        <div id="playerList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[460px] overflow-y-auto pr-1">
          <!-- ผู้เล่นจะแสดงที่นี่ -->
        </div>
      </div>

      <!-- แถบด้านล่าง: ปุ่มพร้อมสำหรับผู้เล่น และปุ่มควบคุม Admin -->
      <div class="pt-6 border-t border-neutral-800 mt-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- ปุ่มพร้อม (แสดงเฉพาะผู้เล่น) -->
        <button id="readyBtn" onclick="toggleReady()" 
                class="w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-400 text-black">
          <span id="readyDot" class="w-2.5 h-2.5 rounded-full bg-black"></span>
          <span id="readyText">กดปุ่ม: พร้อมเล่น</span>
        </button>

        <!-- Admin Controls (แสดงเฉพาะ Admin) -->
        <div id="adminControls" class="w-full sm:w-auto hidden flex flex-wrap items-center gap-2">
          
          <!-- ปุ่มปิดห้อง ยกเลิกห้องและเกม -->
          <button onclick="adminCloseRoom()" 
                  class="bg-neutral-800 hover:bg-red-600/20 text-red-500 hover:text-red-400 text-xs font-semibold px-4 py-3 rounded-xl transition-all border border-red-500/40 flex items-center gap-1.5">
            <span>🚫</span> ปิดห้อง (ยกเลิกห้องและเกม)
          </button>

          <!-- ปุ่มเริ่มเกมทุกคน (เวลาจะยังไม่เดินจนกว่าจะกด Play ในเกม) -->
          <button onclick="adminStartGame()" 
                  class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-6 py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
            <span>เข้าหน้าเกมทุกคน</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path></svg>
          </button>
        </div>

      </div>
    </section>

    <!-- ช่องแชทกลางห้อง -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg h-[550px] lg:h-auto">
      <div>
        <h2 class="text-base font-bold text-white pb-3 border-b border-neutral-800">
          ห้องแชทสด (Realtime Chat)
        </h2>
        <div id="chatBox" class="mt-4 space-y-3 overflow-y-auto max-h-[380px] pr-2 text-sm"></div>
      </div>

      <form onsubmit="sendMessage(event)" class="mt-4 pt-3 border-t border-neutral-800 flex gap-2">
        <input type="text" id="chatMsg" placeholder="พิมพ์ข้อความคุยในห้อง..." 
               class="flex-1 bg-neutral-950 border border-neutral-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
        <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-black px-4 py-2.5 rounded-xl font-semibold text-sm transition-colors">
          ส่ง
        </button>
      </form>
    </section>

  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFzJ6nZGBwMmuqbAiFeIHOhoxigj-Bw2U",
      authDomain: "family-fso.firebaseapp.com",
      projectId: "family-fso",
      storageBucket: "family-fso.firebasestorage.app",
      messagingSenderId: "841262550099",
      appId: "1:841262550099:web:b2348a193c9780faf40aa6",
      measurementId: "G-CPWT56MLC3"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const currentUser = JSON.parse(localStorage.getItem('gameUser'));
    if (!currentUser || !currentUser.roomId) {
      window.location.href = "index.html";
    }

    const roomId = currentUser.roomId;
    document.getElementById('displayRoomId').innerText = roomId;
    document.getElementById('uName').innerText = currentUser.name;
    document.getElementById('uRole').innerText = currentUser.role.toUpperCase() + (currentUser.role === 'admin' ? ' 🥸' : '');

    if (currentUser.role === 'admin') {
      document.getElementById('adminControls').classList.remove('hidden');
      document.getElementById('readyBtn').classList.add('hidden');
    }

    let isMyReady = false;
    const roomDoc = db.collection('rooms').doc(roomId);

    // 1. ลงทะเบียนผู้ใช้งานเข้าห้อง
    async function joinRoom() {
      try {
        await roomDoc.collection('players').doc(currentUser.uid).set({
          uid: currentUser.uid,
          name: currentUser.name,
          career: currentUser.career || "ผู้ดูแลระบบ",
          role: currentUser.role,
          isReady: currentUser.role === 'admin' ? true : false,
          joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } catch (err) {
        console.error("Error joining room:", err);
      }
    }
    joinRoom();

    // 2. ตรวจสอบสถานะห้องแบบ Realtime (ถ้าเริ่มให้ไปหน้าเกม / ถ้าปิดห้องให้ดีดออกทุกคน)
    roomDoc.onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        
        // หาก Admin สั่งเริ่มเกม
        if (data.status === 'playing') {
          window.location.href = "game.html";
        }
        
        // หาก Admin สั่งปิดห้อง (ยกเลิกห้องและเกม)
        if (data.status === 'closed') {
          alert("⚠️ ห้องนี้ถูกปิดหรือยกเลิกโดยผู้ดูแลระบบ (Admin) แล้ว");
          localStorage.removeItem('gameUser');
          window.location.href = "index.html";
        }
      }
    });

    // 3. แสดงรายชื่อคนในห้อง
    roomDoc.collection('players').onSnapshot(snapshot => {
      const container = document.getElementById('playerList');
      const counter = document.getElementById('playerCounter');
      container.innerHTML = '';
      
      const allMembers = [];
      snapshot.forEach(doc => allMembers.push(doc.data()));

      const playerCount = allMembers.filter(m => m.role === 'player').length;
      counter.innerText = `${playerCount} / 20`;

      allMembers.forEach(p => {
        const isSelf = p.uid === currentUser.uid;
        if (isSelf) isMyReady = p.isReady;

        const card = document.createElement('div');
        const isAdmin = p.role === 'admin';
        
        card.className = `p-3.5 rounded-xl border flex items-center justify-between ${
          isAdmin ? 'border-red-500/50 bg-red-950/20' : (isSelf ? 'border-sky-500/50 bg-neutral-950' : 'border-neutral-800 bg-neutral-950/60')
        }`;

        const statusColor = (isAdmin || p.isReady) ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-amber-400 shadow-[0_0_8px_#f59e0b]';
        const statusText = isAdmin ? 'ผู้ดูแลห้อง' : (p.isReady ? 'พร้อมแล้ว' : 'กำลังเตรียมตัว');

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full ${statusColor}"></span>
            <div>
              <div class="font-semibold text-sm text-white flex items-center gap-1.5">
                ${p.name} 
                ${isAdmin ? '<span class="text-[10px] text-red-400 border border-red-500/50 rounded px-1">GM 🥸</span>' : ''}
                ${isSelf && !isAdmin ? '<span class="text-[10px] text-sky-400 border border-sky-400/40 rounded px-1">คุณ</span>' : ''}
              </div>
              <div class="text-xs text-neutral-400">${p.career}</div>
            </div>
          </div>
          <span class="text-xs font-medium ${isAdmin ? 'text-red-400' : (p.isReady ? 'text-emerald-400' : 'text-amber-400')}">${statusText}</span>
        `;
        container.appendChild(card);
      });

      if (currentUser.role === 'player') {
        updateMyReadyButton();
      }
    });

    // 4. สลับสถานะพร้อม
    async function toggleReady() {
      await roomDoc.collection('players').doc(currentUser.uid).update({
        isReady: !isMyReady
      });
    }

    function updateMyReadyButton() {
      const btn = document.getElementById('readyBtn');
      const txt = document.getElementById('readyText');
      if (isMyReady) {
        btn.className = "w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all shadow-lg flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-black";
        txt.innerText = "สถานะ: พร้อมแล้ว (กดยกเลิก)";
      } else {
        btn.className = "w-full sm:w-auto px-8 py-3 rounded-xl font-semibold transition-all shadow-lg flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-400 text-black";
        txt.innerText = "กดปุ่ม: พร้อมเล่น";
      }
    }

    // 5. ระบบแชทสด
    roomDoc.collection('chat').orderBy('time', 'asc').limitToLast(50).onSnapshot(snapshot => {
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      snapshot.forEach(doc => {
        const msg = doc.data();
        const d = document.createElement('div');
        d.className = "bg-neutral-950 border border-neutral-800 rounded-lg p-2.5";
        d.innerHTML = `
          <div class="flex justify-between items-center text-xs mb-1">
            <span class="font-bold ${msg.role === 'admin' ? 'text-red-400' : 'text-sky-400'}">${msg.sender}</span>
          </div>
          <p class="text-neutral-200 text-sm break-words">${msg.text}</p>
        `;
        box.appendChild(d);
      });
      box.scrollTop = box.scrollHeight;
    });

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatMsg');
      const text = input.value.trim();
      if (!text) return;

      await roomDoc.collection('chat').add({
        sender: currentUser.name + (currentUser.role === 'admin' ? ' 🥸' : ''),
        role: currentUser.role,
        text: text,
        time: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = '';
    }

    // 6. Admin เริ่มเกมทุกคน (เวลาหยุดไว้ก่อน รอไปกด Play ในเกม)
    async function adminStartGame() {
      if (confirm("ต้องการพาผู้เล่นทุกคนเข้าหน้าเกมหรือไม่? (เวลาจะยังไม่เดินจนกว่า Admin จะกดปุ่ม Play ในเกม)")) {
        await roomDoc.set({ 
          status: 'playing',
          isTimePaused: true 
        }, { merge: true });
      }
    }

    // 7. Admin ปิดห้อง (ยกเลิกห้องและเกมหมายเลขนี้)
    async function adminCloseRoom() {
      const confirmed = confirm(`⚠️ คุณต้องการปิดห้องหมายเลข ${roomId} ใช่หรือไม่?\nการกระทำนี้จะยกเลิกห้องและเกม และส่งผู้เล่นทุกคนกลับสู่หน้า Login`);
      if (!confirmed) return;

      try {
        // อัปเดตสถานะห้องเป็น closed บน Firestore เพื่อส่งสัญญาณให้ทุกคนในห้องเด้งออกพร้อมกัน
        await roomDoc.update({
          status: 'closed',
          isTimePaused: true
        });

        // ล้างข้อมูลตนเองและกลับหน้า Login
        localStorage.removeItem('gameUser');
        window.location.href = "index.html";
      } catch (err) {
        alert("ปิดห้องไม่สำเร็จ: " + err.message);
      }
    }

    // 8. ผู้เล่นออกจากห้องรายบุคคล
    async function leaveRoom() {
      try {
        if (currentUser && currentUser.uid) {
          await roomDoc.collection('players').doc(currentUser.uid).delete();
        }
      } catch (e) {
        console.error("Error leaving room:", e);
      } finally {
        localStorage.removeItem('gameUser');
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
