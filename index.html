<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - เกมจำลองการเงิน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden">

  <div class="absolute -top-40 -left-40 w-96 h-96 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <header class="w-full pt-10 text-center z-10">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider text-white">
      FINANCIAL <span class="text-red-500">SIMULATOR</span> <span class="text-sky-400">ONLINE</span>
    </h1>
    <p class="text-neutral-400 text-sm mt-1">เกมจำลองการเงินและการลงทุนแบบผู้เล่นหลายคน</p>
  </header>

  <main class="w-full max-w-md px-6 py-6 z-10">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
      
      <!-- Google Login -->
      <button onclick="loginWithGoogle()" 
              class="w-full flex items-center justify-center gap-3 bg-white text-black font-semibold py-3 px-4 rounded-xl hover:bg-neutral-200 transition-all duration-200 shadow-md">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <div class="relative my-6 text-center">
        <hr class="border-neutral-800">
        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-neutral-900 px-3 text-xs text-neutral-400">
          หรือ เข้าเล่นแบบ Guest
        </span>
      </div>

      <!-- Guest Login -->
      <form onsubmit="loginAsGuest(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">ชื่อผู้เล่น <span class="text-red-500">*</span></label>
          <input type="text" id="guestName" required placeholder="ใส่ชื่อของคุณ" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">เบอร์โทรศัพท์</label>
          <input type="tel" id="guestPhone" placeholder="08X-XXX-XXXX" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">อีเมล</label>
          <input type="email" id="guestEmail" placeholder="player@example.com" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">เลือกอาชีพเริ่มต้น</label>
          <select id="guestCareer" class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
            <option value="พนักงานบริษัท">พนักงานบริษัท</option>
            <option value="ฟรีแลนซ์">ฟรีแลนซ์</option>
            <option value="วิศวกร">วิศวกร</option>
            <option value="แพทย์">แพทย์</option>
            <option value="เจ้าของร้านค้า">เจ้าของร้านค้า</option>
          </select>
        </div>

        <button type="submit" class="w-full mt-2 bg-sky-500 hover:bg-sky-400 text-black font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-sky-500/20">
          เข้าสู่ห้องรอออนไลน์
        </button>
      </form>
    </div>
  </main>

  <footer class="w-full py-4 border-t border-neutral-900 bg-neutral-950/80 flex justify-between items-center px-8 z-10">
    <div class="text-xs text-neutral-500">รองรับผู้เล่นสูงสุด 20 คนพร้อมกันจากทุกที่</div>
    <button onclick="openAdminModal()" class="w-10 h-10 flex items-center justify-center text-2xl rounded-full bg-neutral-900 border border-neutral-800 hover:border-red-500 transition-all">
      🥸
    </button>
  </footer>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-neutral-900 border border-red-500/50 rounded-2xl w-full max-w-sm p-6 relative">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">✕</button>
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🥸</div>
        <h3 class="text-lg font-bold text-red-500">เข้าสู่ระบบ Admin กลาง</h3>
        <p class="text-xs text-neutral-400">ควบคุมห้องเล่นเกมแบบเรียลไทม์</p>
      </div>
      <form onsubmit="loginAsAdmin(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-neutral-300 mb-1">รหัสผ่าน Admin</label>
          <input type="password" id="adminPassword" required placeholder="รหัสควบคุมระบบ" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-lg transition-colors">
          เข้าสู่ระบบ Admin
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts (v9 Compat เพื่อให้ใช้ได้ทันทีไม่ต้อง Bundle) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ** นำ Firebase Config ของคุณมาวางตรงนี้ **
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

    // 1. Google Login
    async function loginWithGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const res = await auth.signInWithPopup(provider);
        const user = res.user;

        const userData = {
          uid: user.uid,
          name: user.displayName || "Google Player",
          email: user.email || "-",
          phone: user.phoneNumber || "-",
          career: "พนักงานบริษัท",
          role: "player"
        };
        await enterLobby(userData);
      } catch (err) {
        alert("Google Login ผิดพลาด: " + err.message);
      }
    }

    // 2. Guest Login
    async function loginAsGuest(e) {
      e.preventDefault();
      const guestId = "guest_" + Math.random().toString(36).substring(2, 9);
      const userData = {
        uid: guestId,
        name: document.getElementById('guestName').value.trim(),
        phone: document.getElementById('guestPhone').value.trim() || "-",
        email: document.getElementById('guestEmail').value.trim() || "-",
        career: document.getElementById('guestCareer').value,
        role: "player"
      };
      await enterLobby(userData);
    }

    // 3. Admin Login
    async function loginAsAdmin(e) {
      e.preventDefault();
      const pw = document.getElementById('adminPassword').value;
      if (pw === "admin1234") { // รหัสผ่าน Admin
        const adminData = {
          uid: "admin_master",
          name: "Game Master 🥸",
          phone: "-",
          email: "admin@gamemaster.io",
          career: "ผู้ดูแลระบบ",
          role: "admin"
        };
        await enterLobby(adminData);
      } else {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }

    // บันทึกและนำเข้าห้อง
    async function enterLobby(user) {
      localStorage.setItem('gameUser', JSON.stringify(user));
      window.location.href = "lobby.html";
    }
  </script>
</body>
</html>
